name: j6+
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Creating Env!
      uses: actions/checkout@v2

    - name: Setting up Env!
      run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install git make bc bison \
          openssl curl zip kmod cpio flex libelf-dev \
          libssl-dev libtfm-dev wget device-tree-compiler \
          ca-certificates python3 python2 binutils \
          binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi
    - name: Building Kernel..
      run: |
          chmod +x build.sh && bash build.sh
      shell: bash
      env:
         TZ: Asia/Jakarta
         CHATID: ${{ secrets.CHAT_ID }}
         API_BOT: ${{ secrets.BOT_API }}
    - name: Package kernel
        run: |
          git clone --depth=1 ${{ env.ANYKERNEL_SOURCE }} -b ${{ env.ANYKERNEL_SOURCE_BRANCH }} AnyKernel3 && rm -rf AnyKernel3/.git AnyKernel3/.github AnyKernel3/LICENSE AnyKernel3/README.md
          if [[ -f out/arch/arm/boot/zImage.gz-dtb ]]; then
            cp out/arch/arm/boot/zImage.gz-dtb AnyKernel3/Image.gz-dtb
          elif [[ -f out/arch/arm/boot/zImage-dtb ]]; then
            cp out/arch/arm/boot/zImage-dtb AnyKernel3/Image-dtb
          elif [[ -f out/arch/arm/boot/zImage.gz ]]; then
            cp out/arch/arm/boot/zImage.gz AnyKernel3/Image.gz
          elif [[ -f out/arch/arm/boot/Image ]]; then
            cp out/arch/arm/boot/Image AnyKernel3/Image
          fi
          if [ -f out/arch/arm/boot/dtbo.img ]; then
            cp out/arch/arm/boot/dtbo.img AnyKernel3/dtbo.img
          fi

      - name: Upload kernel to artifact
        uses: actions/upload-artifact@v4
        with:
          name: output_kernel
          path: AnyKernel3/*
